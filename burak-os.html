<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Burak-OS</title>
<style>
  /* ============================================================
     BURAK-OS  |  Fluent Design esinli işletim sistemi simülasyonu
     ============================================================ */

  :root {
    --accent: #4cc2ff;
    --accent-2: #2b88d8;
    --bg-1: #1f2230;
    --bg-2: #2a2d3e;
    --bg-3: #34384c;
    --text: #f3f3f3;
    --text-dim: #c7c7c7;
    --border: rgba(255, 255, 255, 0.08);
    --glass: rgba(32, 32, 40, 0.55);
    --glass-strong: rgba(32, 32, 40, 0.78);
    --shadow: 0 12px 36px rgba(0, 0, 0, 0.45);
    --radius: 12px;
    --radius-sm: 8px;
  }

  /* Açık tema */
  body.light {
    --bg-1: #f4f6fb;
    --bg-2: #ffffff;
    --bg-3: #e9ecf4;
    --text: #1a1a1a;
    --text-dim: #4a4a4a;
    --border: rgba(0, 0, 0, 0.08);
    --glass: rgba(255, 255, 255, 0.6);
    --glass-strong: rgba(255, 255, 255, 0.82);
    --shadow: 0 12px 36px rgba(0, 0, 0, 0.18);
  }

  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: "Segoe UI", "Inter", system-ui, -apple-system, sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }

  /* ---------- Masaüstü ---------- */
  #desktop {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #2b3a67 0%, #1f2230 50%, #4a3a6b 100%);
    background-size: cover;
    background-position: center;
    transition: background 0.4s ease;
  }

  #desktop-icons {
    position: absolute;
    top: 16px;
    left: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, 96px);
    gap: 8px;
    z-index: 1;
  }

  .desktop-icon {
    width: 96px;
    height: 92px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px 4px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    color: #fff;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
    transition: background 0.15s ease;
  }
  .desktop-icon:hover { background: rgba(255, 255, 255, 0.10); }
  .desktop-icon.selected { background: rgba(76, 194, 255, 0.25); outline: 1px solid rgba(76, 194, 255, 0.6); }
  .desktop-icon .ico { font-size: 36px; }
  .desktop-icon .lbl { font-size: 12px; text-align: center; line-height: 1.15; }

  /* ---------- Pencereler ---------- */
  .window {
    position: absolute;
    min-width: 360px;
    min-height: 220px;
    width: 720px;
    height: 480px;
    background: var(--glass-strong);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    animation: winOpen 0.18s ease-out;
  }
  @keyframes winOpen {
    from { transform: translateY(8px) scale(0.98); opacity: 0; }
    to   { transform: translateY(0) scale(1);    opacity: 1; }
  }
  .window.minimized { display: none; }
  .window.maximized {
    top: 0 !important;
    left: 0 !important;
    width: 100% !important;
    height: calc(100% - 48px) !important;
    border-radius: 0;
  }

  .window-header {
    height: 36px;
    flex: 0 0 36px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 0 12px;
    cursor: grab;
    border-bottom: 1px solid var(--border);
  }
  .window-header:active { cursor: grabbing; }
  .window-title {
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--text);
    pointer-events: none;
  }
  .window-controls { display: flex; height: 100%; }
  .window-controls button {
    width: 46px;
    height: 100%;
    background: transparent;
    border: 0;
    color: var(--text);
    cursor: pointer;
    font-size: 12px;
    transition: background 0.15s ease;
  }
  .window-controls button:hover { background: rgba(255, 255, 255, 0.08); }
  .window-controls .btn-close:hover { background: #e81123; color: #fff; }

  .window-body {
    flex: 1;
    overflow: auto;
    color: var(--text);
    background: var(--bg-1);
  }

  /* Resize handle */
  .window-resize {
    position: absolute;
    right: 0;
    bottom: 0;
    width: 16px;
    height: 16px;
    cursor: nwse-resize;
    z-index: 2;
  }

  /* ---------- Görev Çubuğu ---------- */
  #taskbar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 48px;
    background: var(--glass);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
    z-index: 9999;
  }
  #taskbar-left {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tb-btn {
    height: 36px;
    min-width: 40px;
    padding: 0 10px;
    border: 0;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--text);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    transition: background 0.15s ease;
  }
  .tb-btn:hover { background: rgba(255, 255, 255, 0.08); }
  .tb-btn.active { background: rgba(76, 194, 255, 0.22); }
  .tb-btn .dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }
  #taskbar-clock {
    font-size: 12px;
    color: var(--text);
    text-align: right;
    line-height: 1.15;
    padding: 0 8px;
  }

  /* ---------- Başlat Menüsü ---------- */
  #start-menu {
    position: fixed;
    left: 50%;
    bottom: 56px;
    transform: translate(-50%, 12px);
    width: 560px;
    max-height: 600px;
    background: var(--glass-strong);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 10000;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #start-menu.open {
    opacity: 1;
    transform: translate(-50%, 0);
    pointer-events: auto;
  }
  #start-search {
    width: 100%;
    height: 36px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-2);
    color: var(--text);
    padding: 0 12px;
    font-size: 13px;
    outline: none;
  }
  #start-search:focus { border-color: var(--accent); }
  .sm-section-title {
    font-size: 12px;
    color: var(--text-dim);
    margin: 4px 0;
  }
  #sm-apps {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .sm-app {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 12px 6px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s ease;
    color: var(--text);
  }
  .sm-app:hover { background: rgba(255, 255, 255, 0.08); }
  .sm-app .ico { font-size: 28px; }
  .sm-app .lbl { font-size: 12px; }
  #sm-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  #sm-user {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
  }
  #sm-user .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex; align-items: center; justify-content: center;
    font-weight: 600; font-size: 13px; color: #fff;
  }
  #sm-power { cursor: pointer; font-size: 18px; padding: 6px 10px; border-radius: var(--radius-sm); }
  #sm-power:hover { background: rgba(255, 255, 255, 0.08); }

  /* ---------- Context Menu ---------- */
  #context-menu {
    position: fixed;
    min-width: 200px;
    background: var(--glass-strong);
    backdrop-filter: blur(28px) saturate(160%);
    -webkit-backdrop-filter: blur(28px) saturate(160%);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    box-shadow: var(--shadow);
    padding: 6px;
    z-index: 11000;
    display: none;
    font-size: 13px;
  }
  #context-menu.open { display: block; }
  .cm-item {
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cm-item:hover { background: rgba(76, 194, 255, 0.22); }
  .cm-sep { height: 1px; background: var(--border); margin: 4px 2px; }

  /* ---------- File Explorer ---------- */
  .fe-wrap { display: flex; height: 100%; }
  .fe-side {
    width: 200px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    padding: 10px;
    font-size: 13px;
    overflow: auto;
  }
  .fe-side .grp-title { color: var(--text-dim); font-size: 11px; text-transform: uppercase; margin: 8px 4px 4px; }
  .fe-side .side-item {
    padding: 6px 8px;
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    gap: 8px;
    align-items: center;
  }
  .fe-side .side-item:hover { background: rgba(255, 255, 255, 0.06); }
  .fe-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .fe-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-2);
  }
  .fe-toolbar button {
    width: 28px; height: 28px; border: 0; border-radius: 6px;
    background: transparent; color: var(--text); cursor: pointer; font-size: 14px;
  }
  .fe-toolbar button:hover { background: rgba(255, 255, 255, 0.08); }
  .fe-toolbar button:disabled { opacity: 0.4; cursor: not-allowed; }
  .fe-path {
    flex: 1;
    height: 28px;
    border-radius: 6px;
    background: var(--bg-3);
    color: var(--text);
    padding: 0 10px;
    border: 1px solid var(--border);
    font-size: 12px;
    display: flex;
    align-items: center;
  }
  .fe-grid {
    flex: 1;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, 110px);
    gap: 10px;
    align-content: start;
    overflow: auto;
  }
  .fe-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
    padding: 10px 6px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-align: center;
    color: var(--text);
  }
  .fe-item:hover { background: rgba(255, 255, 255, 0.06); }
  .fe-item .ico { font-size: 34px; }
  .fe-item .lbl { font-size: 12px; word-break: break-word; }

  /* ---------- Terminal ---------- */
  .term-wrap {
    height: 100%;
    background: #0c0c0c;
    color: #d4d4d4;
    font-family: "Cascadia Mono", "Consolas", "Courier New", monospace;
    font-size: 13px;
    padding: 12px;
    overflow: auto;
    line-height: 1.45;
  }
  .term-line { white-space: pre-wrap; word-break: break-word; }
  .term-prompt { color: #4cc2ff; }
  .term-input-line { display: flex; gap: 6px; }
  .term-input {
    flex: 1;
    background: transparent;
    border: 0;
    outline: none;
    color: #d4d4d4;
    font-family: inherit;
    font-size: inherit;
    caret-color: #4cc2ff;
  }
  .term-error { color: #ff6b6b; }
  .term-ok { color: #6bff95; }
  .term-dim { color: #999; }

  /* ---------- Settings ---------- */
  .settings-wrap {
    display: flex;
    height: 100%;
  }
  .settings-side {
    width: 220px;
    background: var(--bg-2);
    border-right: 1px solid var(--border);
    padding: 14px 10px;
  }
  .settings-side .nav-item {
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .settings-side .nav-item:hover { background: rgba(255, 255, 255, 0.06); }
  .settings-side .nav-item.active { background: rgba(76, 194, 255, 0.18); }
  .settings-main { flex: 1; padding: 22px 26px; overflow: auto; }
  .settings-main h2 { margin: 0 0 6px; font-size: 22px; font-weight: 600; }
  .settings-main p.desc { color: var(--text-dim); margin: 0 0 18px; font-size: 13px; }
  .setting-card {
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 14px 16px;
    margin-bottom: 12px;
  }
  .setting-card label { font-size: 13px; display: block; margin-bottom: 8px; }
  .setting-card input[type="text"] {
    width: 100%;
    height: 32px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-3);
    color: var(--text);
    padding: 0 10px;
    font-size: 13px;
    outline: none;
  }
  .setting-card input[type="text"]:focus { border-color: var(--accent); }
  .wallpaper-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, 110px);
    gap: 10px;
    margin-top: 6px;
  }
  .wallpaper-thumb {
    width: 110px;
    height: 64px;
    border-radius: 6px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .wallpaper-thumb:hover { transform: scale(1.04); }
  .wallpaper-thumb.active { border-color: var(--accent); }
  .toggle-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0;
  }
  .switch {
    position: relative;
    width: 40px; height: 22px;
    background: var(--bg-3);
    border-radius: 11px;
    cursor: pointer;
    transition: background 0.18s ease;
  }
  .switch::after {
    content: '';
    position: absolute;
    top: 3px; left: 3px;
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    transition: transform 0.18s ease;
  }
  .switch.on { background: var(--accent); }
  .switch.on::after { transform: translateX(18px); }

  /* ---------- Text editor / image viewer ---------- */
  .text-editor {
    width: 100%; height: 100%;
    background: var(--bg-2);
    color: var(--text);
    border: 0;
    outline: none;
    font-family: "Cascadia Mono", "Consolas", monospace;
    font-size: 13px;
    padding: 14px;
    resize: none;
  }
  .image-viewer {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    background: #111;
  }
  .image-viewer img { max-width: 100%; max-height: 100%; }

  /* ---------- About app ---------- */
  .about-wrap {
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .about-wrap h1 { margin: 0; font-size: 28px; }
  .about-wrap .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }

  /* ---------- Scrollbar ---------- */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.18); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }

  /* ---------- Boot Screen ---------- */
  #boot {
    position: fixed;
    inset: 0;
    background: #0b0d14;
    color: #fff;
    z-index: 99999;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    transition: opacity 0.4s ease;
  }
  #boot .logo { font-size: 64px; font-weight: 200; letter-spacing: 4px; }
  #boot .spinner {
    width: 28px; height: 28px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Boot ekranı -->
<div id="boot">
  <div class="logo">Burak<span style="color: var(--accent)">OS</span></div>
  <div class="spinner"></div>
  <div style="font-size: 12px; color: #888;">Başlatılıyor...</div>
</div>

<!-- Masaüstü -->
<div id="desktop">
  <div id="desktop-icons"></div>
</div>

<!-- Görev çubuğu -->
<div id="taskbar">
  <div id="taskbar-left">
    <button class="tb-btn" id="btn-start" title="Başlat">
      <span style="font-size:18px;">⊞</span>
    </button>
    <button class="tb-btn" id="btn-search" title="Ara">🔍</button>
    <div id="taskbar-apps" style="display:flex; gap:4px;"></div>
  </div>
  <div id="taskbar-clock">
    <div id="tb-time">--:--</div>
    <div id="tb-date" style="color: var(--text-dim); font-size: 11px;">--</div>
  </div>
</div>

<!-- Başlat menüsü -->
<div id="start-menu">
  <input id="start-search" placeholder="Uygulama, ayar veya dosya ara..." />
  <div>
    <div class="sm-section-title">Sabitlenmiş</div>
    <div id="sm-apps"></div>
  </div>
  <div id="sm-footer">
    <div id="sm-user">
      <div class="avatar" id="sm-avatar">B</div>
      <div id="sm-username">Burak Yusuf Çetin</div>
    </div>
    <div id="sm-power" title="Yeniden başlat">⏻</div>
  </div>
</div>

<!-- Context menu -->
<div id="context-menu"></div>

<script>
/* ============================================================
   BURAK-OS  |  Core scripts
   ============================================================ */

// ---------- Genel state ----------
const OS = {
  username: localStorage.getItem('burakos_username') || 'Burak Yusuf Çetin',
  theme: localStorage.getItem('burakos_theme') || 'dark',
  wallpaper: localStorage.getItem('burakos_wallpaper') ||
    'linear-gradient(135deg, #2b3a67 0%, #1f2230 50%, #4a3a6b 100%)',
};

const WALLPAPERS = [
  { id: 'mor',     css: 'linear-gradient(135deg, #2b3a67 0%, #1f2230 50%, #4a3a6b 100%)' },
  { id: 'okyanus', css: 'linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%)' },
  { id: 'gun',     css: 'linear-gradient(135deg, #ff7e5f 0%, #feb47b 100%)' },
  { id: 'orman',   css: 'linear-gradient(135deg, #134e5e 0%, #71b280 100%)' },
  { id: 'gece',    css: 'linear-gradient(135deg, #000428 0%, #004e92 100%)' },
  { id: 'pembe',   css: 'linear-gradient(135deg, #ee9ca7 0%, #ffdde1 100%)' },
  { id: 'siyah',   css: 'radial-gradient(circle at 30% 20%, #2a2a35 0%, #0c0c10 60%)' },
  { id: 'neon',    css: 'linear-gradient(135deg, #200122 0%, #6f0000 100%)' },
];

/* ============================================================
   1) VIRTUAL FILE SYSTEM
   ============================================================ */
const VFS = {
  root: {
    type: 'folder',
    name: 'C:',
    children: {
      'Users': {
        type: 'folder',
        children: {
          'Burak': {
            type: 'folder',
            children: {
              'Documents': {
                type: 'folder',
                children: {
                  'okuma-listesi.txt': {
                    type: 'file',
                    content: 'Clean Code\nThe Pragmatic Programmer\nDesign Patterns\nRefactoring',
                  },
                  'notlar.txt': {
                    type: 'file',
                    content: 'Burak-OS geliştirme notları:\n- Window manager hazır\n- Terminal komutları genişletilebilir\n- Settings ile dark/light tema değiştirilebilir',
                  },
                  'Projeler': {
                    type: 'folder',
                    children: {
                      'burak-os.md': {
                        type: 'file',
                        content: '# Burak-OS\n\nTek HTML dosyasıyla işletim sistemi simülasyonu.',
                      },
                    },
                  },
                },
              },
              'Pictures': {
                type: 'folder',
                children: {
                  'duvar.png': {
                    type: 'file',
                    mime: 'image',
                    content: 'data:image/svg+xml;utf8,' + encodeURIComponent(
                      '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400">'
                      + '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">'
                      + '<stop offset="0%" stop-color="#4cc2ff"/><stop offset="100%" stop-color="#7a2bd8"/>'
                      + '</linearGradient></defs>'
                      + '<rect width="600" height="400" fill="url(%23g)"/>'
                      + '<text x="50%" y="50%" fill="white" font-family="Segoe UI" font-size="36" text-anchor="middle" dy=".3em">Burak-OS</text>'
                      + '</svg>'),
                  },
                },
              },
              'Downloads': { type: 'folder', children: {} },
              'Desktop':   { type: 'folder', children: {} },
            },
          },
        },
      },
      'Windows': {
        type: 'folder',
        children: {
          'System32': {
            type: 'folder',
            children: {
              'config.sys': { type: 'file', content: '# Sistem dosyası - düzenlemeyin' },
            },
          },
        },
      },
      'Program Files': { type: 'folder', children: {} },
    },
  },

  /** Path -> node. Path: "C:/Users/Burak/Documents" */
  resolve(path) {
    if (!path || path === 'C:' || path === 'C:/' || path === '/') return this.root;
    const parts = path.replace(/^C:\/?/, '').split('/').filter(Boolean);
    let node = this.root;
    for (const p of parts) {
      if (!node.children || !node.children[p]) return null;
      node = node.children[p];
    }
    return node;
  },

  list(path) {
    const node = this.resolve(path);
    if (!node || node.type !== 'folder') return [];
    return Object.entries(node.children).map(([name, n]) => ({
      name, type: n.type, mime: n.mime,
    }));
  },

  read(path) {
    const node = this.resolve(path);
    if (!node || node.type !== 'file') return null;
    return node.content || '';
  },

  parentPath(path) {
    if (path === 'C:' || path === 'C:/') return 'C:';
    const parts = path.replace(/^C:\/?/, '').split('/').filter(Boolean);
    parts.pop();
    return parts.length ? 'C:/' + parts.join('/') : 'C:';
  },

  join(base, name) {
    if (base === 'C:' || base === 'C:/') return 'C:/' + name;
    return base + '/' + name;
  },
};

/* ============================================================
   2) WINDOW MANAGER
   ============================================================ */
class WindowManager {
  constructor() {
    this.windows = new Map();   // id -> { el, app, state }
    this.zCounter = 100;
    this.activeId = null;
    this.taskbarApps = document.getElementById('taskbar-apps');
  }

  /**
   * @param {Object} opts
   * @param {string} opts.id     - Açılırsa odaklanır (singleton)
   * @param {string} opts.title
   * @param {string} opts.icon
   * @param {number} [opts.width=720]
   * @param {number} [opts.height=480]
   * @param {(body:HTMLElement, win:Object)=>void} opts.render
   */
  open(opts) {
    if (opts.id && this.windows.has(opts.id)) {
      const w = this.windows.get(opts.id);
      if (w.el.classList.contains('minimized')) {
        w.el.classList.remove('minimized');
      }
      this.focus(opts.id);
      return w;
    }

    const id = opts.id || ('win_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6));
    const width  = opts.width  || 720;
    const height = opts.height || 480;

    const el = document.createElement('div');
    el.className = 'window';
    el.dataset.id = id;
    el.style.width  = width + 'px';
    el.style.height = height + 'px';

    // Açılış pozisyonu (cascade)
    const offset = (this.windows.size % 8) * 24;
    const left = Math.max(20, (window.innerWidth  - width)  / 2 - 80 + offset);
    const top  = Math.max(20, (window.innerHeight - height) / 2 - 60 + offset);
    el.style.left = left + 'px';
    el.style.top  = top  + 'px';

    el.innerHTML = `
      <div class="window-header">
        <div class="window-title">
          <span style="font-size:14px;">${opts.icon || '🪟'}</span>
          <span>${opts.title || 'Pencere'}</span>
        </div>
        <div class="window-controls">
          <button class="btn-min"   title="Küçült">—</button>
          <button class="btn-max"   title="Büyüt">▢</button>
          <button class="btn-close" title="Kapat">✕</button>
        </div>
      </div>
      <div class="window-body"></div>
      <div class="window-resize"></div>
    `;

    document.body.appendChild(el);
    const body = el.querySelector('.window-body');

    const win = { id, el, body, opts, state: { maximized: false, prev: null } };
    this.windows.set(id, win);

    // Render içerik
    if (typeof opts.render === 'function') opts.render(body, win);

    // Olaylar
    this._bindWindowEvents(win);
    this._addTaskbarApp(win);

    this.focus(id);
    return win;
  }

  focus(id) {
    const w = this.windows.get(id);
    if (!w) return;
    this.zCounter++;
    w.el.style.zIndex = this.zCounter;
    this.activeId = id;
    this._refreshTaskbar();
  }

  close(id) {
    const w = this.windows.get(id);
    if (!w) return;
    w.el.remove();
    this.windows.delete(id);
    const tb = document.querySelector(`.tb-btn[data-tb="${id}"]`);
    if (tb) tb.remove();
  }

  minimize(id) {
    const w = this.windows.get(id);
    if (!w) return;
    w.el.classList.add('minimized');
    this._refreshTaskbar();
  }

  toggleMaximize(id) {
    const w = this.windows.get(id);
    if (!w) return;
    if (w.state.maximized) {
      w.el.classList.remove('maximized');
      if (w.state.prev) {
        w.el.style.left   = w.state.prev.left;
        w.el.style.top    = w.state.prev.top;
        w.el.style.width  = w.state.prev.width;
        w.el.style.height = w.state.prev.height;
      }
      w.state.maximized = false;
    } else {
      w.state.prev = {
        left: w.el.style.left, top: w.el.style.top,
        width: w.el.style.width, height: w.el.style.height,
      };
      w.el.classList.add('maximized');
      w.state.maximized = true;
    }
  }

  _bindWindowEvents(win) {
    const { el } = win;
    const header = el.querySelector('.window-header');
    const btnMin   = el.querySelector('.btn-min');
    const btnMax   = el.querySelector('.btn-max');
    const btnClose = el.querySelector('.btn-close');

    el.addEventListener('mousedown', () => this.focus(win.id), true);

    btnMin.addEventListener('click', (e) => { e.stopPropagation(); this.minimize(win.id); });
    btnMax.addEventListener('click', (e) => { e.stopPropagation(); this.toggleMaximize(win.id); });
    btnClose.addEventListener('click', (e) => { e.stopPropagation(); this.close(win.id); });
    header.addEventListener('dblclick', () => this.toggleMaximize(win.id));

    // Drag
    let dragging = false, dx = 0, dy = 0;
    header.addEventListener('mousedown', (e) => {
      if (e.target.closest('button')) return;
      if (win.state.maximized) return;
      dragging = true;
      const rect = el.getBoundingClientRect();
      dx = e.clientX - rect.left;
      dy = e.clientY - rect.top;
      document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      let x = e.clientX - dx;
      let y = e.clientY - dy;
      x = Math.max(0, Math.min(window.innerWidth  - 80,  x));
      y = Math.max(0, Math.min(window.innerHeight - 80,  y));
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
    });
    document.addEventListener('mouseup', () => {
      dragging = false;
      document.body.style.userSelect = '';
    });

    // Resize
    const resizer = el.querySelector('.window-resize');
    let resizing = false, sw = 0, sh = 0, sx = 0, sy = 0;
    resizer.addEventListener('mousedown', (e) => {
      e.stopPropagation();
      if (win.state.maximized) return;
      resizing = true;
      sw = el.offsetWidth; sh = el.offsetHeight;
      sx = e.clientX; sy = e.clientY;
    });
    document.addEventListener('mousemove', (e) => {
      if (!resizing) return;
      const w = Math.max(360, sw + (e.clientX - sx));
      const h = Math.max(220, sh + (e.clientY - sy));
      el.style.width  = w + 'px';
      el.style.height = h + 'px';
    });
    document.addEventListener('mouseup', () => { resizing = false; });
  }

  _addTaskbarApp(win) {
    const btn = document.createElement('button');
    btn.className = 'tb-btn';
    btn.dataset.tb = win.id;
    btn.innerHTML = `<span style="font-size:15px;">${win.opts.icon || '🪟'}</span><span class="dot"></span>`;
    btn.title = win.opts.title || 'Pencere';
    btn.addEventListener('click', () => {
      if (win.el.classList.contains('minimized')) {
        win.el.classList.remove('minimized');
        this.focus(win.id);
      } else if (this.activeId === win.id) {
        this.minimize(win.id);
      } else {
        this.focus(win.id);
      }
    });
    this.taskbarApps.appendChild(btn);
  }

  _refreshTaskbar() {
    document.querySelectorAll('#taskbar-apps .tb-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.tb === this.activeId);
    });
  }
}

  _render(body, startPath) {
    body.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'fe-wrap';
    wrap.innerHTML = `
      <div class="fe-side">
        <div class="grp-title">Hızlı Erişim</div>
        <div class="side-item" data-go="C:/Users/Burak">🏠 Ana Klasör</div>
        <div class="side-item" data-go="C:/Users/Burak/Desktop">🖥️ Masaüstü</div>
        <div class="side-item" data-go="C:/Users/Burak/Documents">📄 Belgeler</div>
        <div class="side-item" data-go="C:/Users/Burak/Downloads">⬇️ İndirilenler</div>
        <div class="side-item" data-go="C:/Users/Burak/Pictures">🖼️ Resimler</div>
        <div class="grp-title">Bu Bilgisayar</div>
        <div class="side-item" data-go="C:">💽 C: Sürücüsü</div>
      </div>
      <div class="fe-main">
        <div class="fe-toolbar">
          <button class="fe-back" title="Geri">←</button>
          <button class="fe-fwd"  title="İleri">→</button>
          <button class="fe-up"   title="Üst Klasör">↑</button>
          <div class="fe-path"></div>
        </div>
        <div class="fe-grid"></div>
      </div>
    `;
    body.appendChild(wrap);

    const state = { path: startPath, history: [startPath], idx: 0 };
    const grid = wrap.querySelector('.fe-grid');
    const pathBox = wrap.querySelector('.fe-path');
    const btnBack = wrap.querySelector('.fe-back');
    const btnFwd  = wrap.querySelector('.fe-fwd');
    const btnUp   = wrap.querySelector('.fe-up');

    const render = () => {
      pathBox.textContent = state.path;
      grid.innerHTML = '';
      const items = VFS.list(state.path);
      if (!items.length) {
        grid.innerHTML = '<div style="grid-column:1/-1;color:var(--text-dim);padding:16px;">Bu klasör boş.</div>';
      }
      items.forEach(it => {
        const el = document.createElement('div');
        el.className = 'fe-item';
        const ico = it.type === 'folder' ? '📁'
                  : it.mime === 'image'  ? '🖼️'
                  : it.name.endsWith('.txt') || it.name.endsWith('.md') ? '📄'
                  : '📑';
        el.innerHTML = `<div class="ico">${ico}</div><div class="lbl">${it.name}</div>`;
        el.addEventListener('dblclick', () => {
          const full = VFS.join(state.path, it.name);
          if (it.type === 'folder') {
            navigate(full);
          } else {
            openFile(full, it);
          }
        });
        grid.appendChild(el);
      });
      btnBack.disabled = state.idx === 0;
      btnFwd.disabled  = state.idx >= state.history.length - 1;
    };

    const navigate = (newPath) => {
      state.history = state.history.slice(0, state.idx + 1);
      state.history.push(newPath);
      state.idx = state.history.length - 1;
      state.path = newPath;
      render();
    };

    const openFile = (full, it) => {
      if (it.mime === 'image') {
        WM.open({
          title: it.name, icon: '🖼️', width: 600, height: 460,
          render: (b) => {
            b.innerHTML = `<div class="image-viewer"><img src="${VFS.read(full)}" alt=""></div>`;
          },
        });
      } else {
        const content = VFS.read(full);
        WM.open({
          title: it.name + ' — Not Defteri', icon: '📝', width: 560, height: 420,
          render: (b) => {
            b.innerHTML = `<textarea class="text-editor" spellcheck="false"></textarea>`;
            b.querySelector('textarea').value = content || '';
          },
        });
      }
    };

    btnBack.addEventListener('click', () => {
      if (state.idx > 0) { state.idx--; state.path = state.history[state.idx]; render(); }
    });
    btnFwd.addEventListener('click', () => {
      if (state.idx < state.history.length - 1) { state.idx++; state.path = state.history[state.idx]; render(); }
    });
    btnUp.addEventListener('click', () => {
      const parent = VFS.parentPath(state.path);
      if (parent !== state.path) navigate(parent);
    });

    wrap.querySelectorAll('.side-item').forEach(si => {
      si.addEventListener('click', () => navigate(si.dataset.go));
    });

    render();
  },
};

// ----- 3.2 Terminal -----
APPS.terminal = {
  id: 'app-terminal',
  title: 'Terminal',
  icon: '⌨️',
  open() {
    WM.open({
      id: this.id,
      title: this.title,
      icon: this.icon,
      width: 720, height: 440,
      render: (body) => this._render(body),
    });
  },
  _render(body) {
    body.style.background = '#0c0c0c';
    body.innerHTML = `<div class="term-wrap"></div>`;
    const term = body.querySelector('.term-wrap');

    const state = {
      cwd: 'C:/Users/Burak',
      history: [],
      histIdx: -1,
    };

    const write = (text, cls) => {
      const div = document.createElement('div');
      div.className = 'term-line' + (cls ? ' ' + cls : '');
      div.textContent = text;
      term.appendChild(div);
      term.scrollTop = term.scrollHeight;
    };

    const writeHTML = (html) => {
      const div = document.createElement('div');
      div.className = 'term-line';
      div.innerHTML = html;
      term.appendChild(div);
      term.scrollTop = term.scrollHeight;
    };

    const prompt = () => {
      const line = document.createElement('div');
      line.className = 'term-input-line';
      line.innerHTML = `<span class="term-prompt">${state.cwd}&gt;</span><input class="term-input" spellcheck="false" autocomplete="off" />`;
      term.appendChild(line);
      const input = line.querySelector('input');
      input.focus();
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const cmd = input.value;
          state.history.push(cmd);
          state.histIdx = state.history.length;
          // satırı sabitle
          line.innerHTML = `<span class="term-prompt">${state.cwd}&gt;</span> ${escapeHTML(cmd)}`;
          run(cmd);
          prompt();
        } else if (e.key === 'ArrowUp') {
          e.preventDefault();
          if (state.histIdx > 0) {
            state.histIdx--;
            input.value = state.history[state.histIdx] || '';
          }
        } else if (e.key === 'ArrowDown') {
          e.preventDefault();
          if (state.histIdx < state.history.length - 1) {
            state.histIdx++;
            input.value = state.history[state.histIdx] || '';
          } else {
            state.histIdx = state.history.length;
            input.value = '';
          }
        }
      });
      term.scrollTop = term.scrollHeight;
    };

    const escapeHTML = (s) => s.replace(/[&<>"']/g, (c) => (
      { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
    ));

    const run = (raw) => {
      const cmd = (raw || '').trim();
      if (!cmd) return;
      const [name, ...args] = cmd.split(/\s+/);
      const c = name.toLowerCase();

      switch (c) {
        case 'help': {
          writeHTML(
            '<span class="term-ok">Burak-OS Terminal — Komutlar:</span>\n' +
            '  <span class="term-prompt">help</span>           Bu yardım metnini göster\n' +
            '  <span class="term-prompt">date</span>           Tarih ve saati yaz\n' +
            '  <span class="term-prompt">echo</span> &lt;metin&gt;   Metni ekrana yaz\n' +
            '  <span class="term-prompt">cls</span>            Ekranı temizle\n' +
            '  <span class="term-prompt">whoami</span>         Kullanıcı adını göster\n' +
            '  <span class="term-prompt">ver</span>            Sürüm bilgisi\n' +
            '  <span class="term-prompt">dir</span>            Klasör içeriğini listele\n' +
            '  <span class="term-prompt">cd</span> &lt;klasör&gt;    Klasöre gir (.. = üst klasör)\n' +
            '  <span class="term-prompt">pwd</span>            Geçerli yolu yaz\n' +
            '  <span class="term-prompt">cat</span> &lt;dosya&gt;    Dosya içeriğini göster\n' +
            '  <span class="term-prompt">open</span> &lt;uygulama&gt; Uygulama aç (files, settings, about)\n' +
            '  <span class="term-prompt">exit</span>           Terminali kapat'
          );
          break;
        }
        case 'date': {
          const d = new Date();
          write(d.toLocaleString('tr-TR'));
          break;
        }
        case 'echo': {
          write(args.join(' '));
          break;
        }
        case 'cls':
        case 'clear': {
          term.innerHTML = '';
          break;
        }
        case 'whoami': {
          write(OS.username);
          break;
        }
        case 'ver': {
          write('Burak-OS  v1.0.0  (build 2026.05)');
          break;
        }
        case 'pwd': {
          write(state.cwd);
          break;
        }
        case 'dir':
        case 'ls': {
          const items = VFS.list(state.cwd);
          if (!items.length) { write('(boş klasör)', 'term-dim'); break; }
          items.forEach(it => {
            const tag = it.type === 'folder' ? '<DIR>' : '     ';
            write(`${tag}   ${it.name}`);
          });
          break;
        }
        case 'cd': {
          if (!args.length) { write(state.cwd); break; }
          const target = args.join(' ');
          let newPath;
          if (target === '..') {
            newPath = VFS.parentPath(state.cwd);
          } else if (/^[A-Za-z]:/.test(target)) {
            newPath = target;
          } else {
            newPath = VFS.join(state.cwd, target);
          }
          const node = VFS.resolve(newPath);
          if (!node) { write(`Sistem belirtilen yolu bulamıyor: ${target}`, 'term-error'); break; }
          if (node.type !== 'folder') { write(`Klasör değil: ${target}`, 'term-error'); break; }
          state.cwd = newPath;
          break;
        }
        case 'cat':
        case 'type': {
          if (!args.length) { write('Kullanım: cat <dosya>', 'term-error'); break; }
          const full = VFS.join(state.cwd, args.join(' '));
          const content = VFS.read(full);
          if (content == null) { write(`Dosya bulunamadı: ${args.join(' ')}`, 'term-error'); break; }
          write(content);
          break;
        }
        case 'open': {
          const app = (args[0] || '').toLowerCase();
          if (app === 'files' || app === 'explorer') APPS.fileExplorer.open();
          else if (app === 'settings') APPS.settings.open();
          else if (app === 'about') APPS.about.open();
          else if (app === 'terminal') APPS.terminal.open();
          else write('Bilinmeyen uygulama: ' + app, 'term-error');
          break;
        }
        case 'exit': {
          WM.close('app-terminal');
          break;
        }
        default: {
          write(`"${name}" bir komut olarak tanınmıyor. 'help' yazarak komut listesini görebilirsin.`, 'term-error');
        }
      }
    };

    writeHTML(`<span class="term-ok">Burak-OS Terminal [Sürüm 1.0.0]</span>`);
    writeHTML(`<span class="term-dim">(c) Burak Yusuf Çetin. Tüm hakları saklıdır.</span>`);
    writeHTML(`<span class="term-dim">'help' yazarak komutları görebilirsin.</span>\n`);
    prompt();

    // tıklayınca her zaman son input'a fokus
    term.addEventListener('click', () => {
      const inputs = term.querySelectorAll('.term-input');
      if (inputs.length) inputs[inputs.length - 1].focus();
    });
  },
};

          refreshUserUI();
          main.querySelector('#acc-msg').textContent = 'Kaydedildi.';
          setTimeout(() => { const m = main.querySelector('#acc-msg'); if (m) m.textContent = ''; }, 1800);
        });
      }

      if (sec === 'appearance') {
        const isLight = OS.theme === 'light';
        main.innerHTML = `
          <h2>Görünüm</h2>
          <p class="desc">Tema modunu değiştir.</p>
          <div class="setting-card">
            <div class="toggle-row">
              <div>
                <div style="font-size:13px;">Açık tema</div>
                <div style="font-size:12px; color: var(--text-dim);">Pencere ve menüler açık renkli görünür.</div>
              </div>
              <div class="switch ${isLight ? 'on' : ''}" id="sw-theme"></div>
            </div>
          </div>
        `;
        main.querySelector('#sw-theme').addEventListener('click', () => {
          OS.theme = OS.theme === 'light' ? 'dark' : 'light';
          localStorage.setItem('burakos_theme', OS.theme);
          applyTheme();
          renderSection('appearance');
        });
      }

      if (sec === 'about') {
        main.innerHTML = `
          <h2>Burak-OS Hakkında</h2>
          <p class="desc">Sistem bilgileri</p>
          <div class="setting-card">
            <div class="row"><span>Sistem adı</span><span>Burak-OS</span></div>
            <div class="row"><span>Sürüm</span><span>1.0.0</span></div>
            <div class="row"><span>Geliştirici</span><span>${escapeHTML(OS.username)}</span></div>
            <div class="row"><span>Mimarisi</span><span>HTML + CSS + ES6+</span></div>
            <div class="row"><span>Build</span><span>2026.05</span></div>
          </div>
        `;
      }
    };

    wrap.querySelectorAll('.nav-item').forEach(n => {
      n.addEventListener('click', () => setActive(n.dataset.sec));
    });
    setActive(section);
  },
};

// ----- 3.4 About -----

            <div style="margin-top:10px;">
              <div class="row"><span>Sürüm</span><span>1.0.0</span></div>

// ----- 3.5 Not Defteri (boş açılır) -----
APPS.notepad = {

/* ============================================================
   4) MASAÜSTÜ & İKONLAR
   ============================================================ */
const DESKTOP_ICONS = [
  { id: 'files',    label: 'Dosya Gezgini', icon: '📁', open: () => APPS.fileExplorer.open() },
  { id: 'term',     label: 'Terminal',      icon: '⌨️', open: () => APPS.terminal.open()     },
  { id: 'settings', label: 'Ayarlar',       icon: '⚙️', open: () => APPS.settings.open()     },
  { id: 'notes',    label: 'Not Defteri',   icon: '📝', open: () => APPS.notepad.open()      },
  { id: 'about',    label: 'Bu Bilgisayar', icon: '💻', open: () => APPS.about.open()        },
];

function renderDesktopIcons() {
  const root = document.getElementById('desktop-icons');
  root.innerHTML = '';
  DESKTOP_ICONS.forEach(it => {
    const el = document.createElement('div');
    el.className = 'desktop-icon';
    el.innerHTML = `<div class="ico">${it.icon}</div><div class="lbl">${it.label}</div>`;
    el.addEventListener('click', () => {
      document.querySelectorAll('.desktop-icon').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
    });
    el.addEventListener('dblclick', () => it.open());
    root.appendChild(el);
  });
}

function renderStartMenu() {
  const sm = document.getElementById('sm-apps');
  sm.innerHTML = '';
  const apps = [
    { label: 'Dosya Gezgini', icon: '📁', open: () => APPS.fileExplorer.open() },
    { label: 'Terminal',      icon: '⌨️', open: () => APPS.terminal.open() },
    { label: 'Ayarlar',       icon: '⚙️', open: () => APPS.settings.open() },
    { label: 'Not Defteri',   icon: '📝', open: () => APPS.notepad.open() },
    { label: 'Hakkında',      icon: 'ℹ️', open: () => APPS.about.open() },
  ];
  apps.forEach(a => {
    const el = document.createElement('div');
    el.className = 'sm-app';
    el.innerHTML = `<div class="ico">${a.icon}</div><div class="lbl">${a.label}</div>`;
    el.addEventListener('click', () => {
      a.open();
      closeStartMenu();
    });
    sm.appendChild(el);
  });
}

/* ============================================================
   5) BAŞLAT MENÜSÜ & SAAT
   ============================================================ */
const startMenu = document.getElementById('start-menu');
const btnStart = document.getElementById('btn-start');

function toggleStartMenu() { startMenu.classList.toggle('open'); }
function closeStartMenu()  { startMenu.classList.remove('open'); }

btnStart.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleStartMenu();
});
document.addEventListener('click', (e) => {
  if (!startMenu.contains(e.target) && !btnStart.contains(e.target)) closeStartMenu();
});
document.getElementById('sm-power').addEventListener('click', () => {
  if (confirm('Burak-OS yeniden başlatılsın mı?')) location.reload();
});

function updateClock() {
  const d = new Date();
  const hh = d.getHours().toString().padStart(2, '0');
  const mm = d.getMinutes().toString().padStart(2, '0');
  document.getElementById('tb-time').textContent = `${hh}:${mm}`;
  document.getElementById('tb-date').textContent = d.toLocaleDateString('tr-TR');
}
updateClock();
setInterval(updateClock, 1000 * 15);

/* ============================================================
   6) CONTEXT MENU
   ============================================================ */
const ctx = document.getElementById('context-menu');

function openContextMenu(x, y, items) {
  ctx.innerHTML = '';
  items.forEach(it => {
    if (it.sep) {
      const s = document.createElement('div');
      s.className = 'cm-sep';
      ctx.appendChild(s);
      return;
    }
    const el = document.createElement('div');
    el.className = 'cm-item';
    el.innerHTML = `<span style="width:18px;">${it.icon || ''}</span><span>${it.label}</span>`;
    el.addEventListener('click', () => {
      closeContextMenu();
      it.action && it.action();
    });
    ctx.appendChild(el);
  });
  ctx.classList.add('open');
  // viewport içine sığdır
  const w = ctx.offsetWidth, h = ctx.offsetHeight;
  const maxX = window.innerWidth  - w - 8;
  const maxY = window.innerHeight - h - 8;
  ctx.style.left = Math.min(x, maxX) + 'px';
  ctx.style.top  = Math.min(y, maxY) + 'px';
}
function closeContextMenu() { ctx.classList.remove('open'); }

document.addEventListener('click', closeContextMenu);
document.addEventListener('contextmenu', (e) => {
  if (e.target.closest('.window') || e.target.closest('#taskbar') ||
      e.target.closest('#start-menu') || e.target.closest('#context-menu')) {
    return;
  }
  e.preventDefault();
  const onIcon = e.target.closest('.desktop-icon');
  if (onIcon) {
    openContextMenu(e.clientX, e.clientY, [
      { icon: '▶️', label: 'Aç',          action: () => onIcon.dispatchEvent(new MouseEvent('dblclick')) },
      { sep: true },
      { icon: '↻',  label: 'Yenile',       action: () => renderDesktopIcons() },
    ]);
  } else {
    openContextMenu(e.clientX, e.clientY, [
      { icon: '↻',  label: 'Yenile',                action: () => renderDesktopIcons() },
      { icon: '🎨', label: 'Duvar Kağıdı Değiştir', action: () => APPS.settings.open('personalization') },
      { sep: true },
      { icon: '🖥️', label: 'Ekran Ayarları',        action: () => APPS.settings.open('appearance') },
      { icon: '🌓', label: 'Temayı Değiştir',       action: toggleTheme },
      { sep: true },
      { icon: '⚙️', label: 'Ayarlar',               action: () => APPS.settings.open() },
    ]);
  }
});

/* ============================================================
   7) TEMA & KULLANICI UI YARDIMCILARI
   ============================================================ */
function applyTheme() {
  document.body.classList.toggle('light', OS.theme === 'light');
}

function toggleTheme() {
  OS.theme = OS.theme === 'light' ? 'dark' : 'light';
  localStorage.setItem('burakos_theme', OS.theme);
  applyTheme();
}

function setWallpaper(css) {
  OS.wallpaper = css;
  localStorage.setItem('burakos_wallpaper', css);
  document.getElementById('desktop').style.background = css;
}

function refreshUserUI() {
  const initials = (OS.username || 'B').trim().charAt(0).toUpperCase();
  document.getElementById('sm-avatar').textContent = initials;
  document.getElementById('sm-username').textContent = OS.username;
  const aboutUser = document.getElementById('about-user');
  if (aboutUser) aboutUser.textContent = OS.username;
}

function escapeAttr(s) {
  return String(s).replace(/"/g, '&quot;');
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"']/g, (c) => (
    { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]
  ));
}

/* ============================================================
   8) BAŞLAT MENÜSÜ ARAMA
   ============================================================ */
document.getElementById('start-search').addEventListener('input', (e) => {
  const q = e.target.value.toLowerCase().trim();
  document.querySelectorAll('#sm-apps .sm-app').forEach(el => {
    const label = el.querySelector('.lbl').textContent.toLowerCase();
    el.style.display = !q || label.includes(q) ? '' : 'none';
  });
});

/* ============================================================
   9) BOOT
   ============================================================ */
function boot() {
  applyTheme();
  document.getElementById('desktop').style.background = OS.wallpaper;
  renderDesktopIcons();
  renderStartMenu();
  refreshUserUI();

  setTimeout(() => {
    const b = document.getElementById('boot');
    b.style.opacity = '0';
    setTimeout(() => b.remove(), 450);
  }, 900);
}
boot();
</script>
